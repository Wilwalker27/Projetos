<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="logoTitle">
  <title id="logoTitle">D'Gula Pizzaria</title>
  <defs>
    <clipPath id="ringClip">
      <circle cx="100" cy="100" r="100" />
    </clipPath>
    <path id="textCurve" d="M14,100 A88,88 0 0 0 186,100" fill="none" />
  </defs>

  <g clip-path="url(#ringClip)">
    <circle cx="100" cy="100" r="100" fill="#C0272D" />

    <!-- steam / flame accents -->
    <g fill="none" stroke="#F7CB4D" stroke-width="3.4" stroke-linecap="round">
      <path d="M23,78 C19,72 27,68 23,61 C19,54 27,50 24,44" />
      <path d="M33,84 C29,78 37,74 33,67 C29,60 37,56 34,50" />
      <path d="M177,78 C181,72 173,68 177,61 C181,54 173,50 176,44" />
      <path d="M167,84 C171,78 163,74 167,67 C171,60 163,56 166,50" />
    </g>

    <!-- inner dough circle -->
    <circle cx="100" cy="84" r="61" fill="#F4C542" />

    <!-- chef hat -->
    <g>
      <circle cx="86" cy="21" r="15" fill="#FFFFFF" />
      <circle cx="114" cy="21" r="15" fill="#FFFFFF" />
      <circle cx="76" cy="38" r="19" fill="#FFFFFF" />
      <circle cx="124" cy="38" r="19" fill="#FFFFFF" />
      <path d="M116,30 a19,19 0 0 1 8,14 a19,19 0 0 1 -6,15" fill="#F3C9C6" opacity="0.55" />
      <circle cx="100" cy="27" r="27" fill="#FFFFFF" />
      <rect x="66" y="46" width="68" height="24" rx="12" fill="#FFFFFF" stroke="#231710" stroke-width="2.5" />
      <path d="M118,48 q14,10 2,20" fill="none" stroke="#231710" stroke-width="1.6" opacity="0.35" />
    </g>

    <!-- ears / hair -->
    <path d="M70,80 q-6,10 2,20 q4,-2 6,-8 Z" fill="#1C130D" />
    <path d="M130,80 q6,10 -2,20 q-4,-2 -6,-8 Z" fill="#1C130D" />
    <path d="M72,70 q28,-18 56,0 q2,10 -4,16 q-24,-16 -48,0 q-6,-6 -4,-16 Z" fill="#1C130D" />

    <!-- face -->
    <ellipse cx="100" cy="96" rx="33" ry="31" fill="#C98A5B" />
    <ellipse cx="79" cy="107" rx="7" ry="5.5" fill="#F0A6A0" opacity="0.75" />
    <ellipse cx="121" cy="107" rx="7" ry="5.5" fill="#F0A6A0" opacity="0.75" />
    <path d="M85,86 q4,-4 9,-1" fill="none" stroke="#231710" stroke-width="2.4" stroke-linecap="round" />
    <path d="M106,85 q5,-3 9,1" fill="none" stroke="#231710" stroke-width="2.4" stroke-linecap="round" />
    <ellipse cx="90" cy="95" rx="3" ry="4" fill="#231710" />
    <ellipse cx="112" cy="94" rx="3" ry="4" fill="#231710" />
    <path d="M93,110 q7,6 15,0.5" fill="none" stroke="#231710" stroke-width="2.4" stroke-linecap="round" />

    <!-- neckerchief -->
    <path d="M75,124 Q100,142 125,124 L124,136 Q100,150 76,136 Z" fill="#9E1F24" stroke="#231710" stroke-width="2" stroke-linejoin="round" />
    <circle cx="100" cy="130" r="5.5" fill="#9E1F24" stroke="#231710" stroke-width="2" />

    <!-- torso -->
    <path d="M56,160 Q56,122 100,122 Q144,122 144,160 L146,200 L54,200 Z" fill="#FFFFFF" stroke="#231710" stroke-width="2.5" stroke-linejoin="round" />
    <path d="M128,128 q20,10 16,40 q-10,6 -18,-2 q6,-20 -4,-32 Z" fill="#F3C9C6" opacity="0.6" />
    <circle cx="100" cy="156" r="4.5" fill="#231710" />

    <!-- arms -->
    <path d="M62,160 Q50,169 56,186 L71,186 Q69,171 79,163 Z" fill="#FFFFFF" stroke="#231710" stroke-width="2.2" stroke-linejoin="round" />
    <path d="M138,160 Q150,169 144,186 L129,186 Q131,171 121,163 Z" fill="#FFFFFF" stroke="#231710" stroke-width="2.2" stroke-linejoin="round" />
    <ellipse cx="67" cy="172" rx="10.5" ry="8.5" fill="#C98A5B" />
    <ellipse cx="133" cy="172" rx="10.5" ry="8.5" fill="#C98A5B" />

    <!-- pizza -->
    <circle cx="100" cy="170" r="27" fill="#F4C542" stroke="#231710" stroke-width="2.6" />
    <circle cx="100" cy="170" r="27" fill="none" stroke="#E7A93B" stroke-width="3.4" stroke-dasharray="1 6" />
    <g fill="#C0272D" stroke="#231710" stroke-width="1.3">
      <ellipse cx="90" cy="159" rx="5.6" ry="5.2" />
      <ellipse cx="111" cy="161" rx="5.2" ry="4.9" />
      <ellipse cx="118" cy="176" rx="5.4" ry="5" />
      <ellipse cx="100" cy="182" rx="5.2" ry="4.9" />
      <ellipse cx="82" cy="177" rx="4.9" ry="4.7" />
    </g>
    <g fill="#231710" opacity="0.55">
      <circle cx="97" cy="169" r="1.2" />
      <circle cx="107" cy="172" r="1.2" />
      <circle cx="92" cy="182" r="1.1" />
      <circle cx="112" cy="182" r="1.1" />
    </g>

    <!-- curved wordmark -->
    <text font-family="'Fredoka','Poppins',sans-serif" font-weight="700" font-size="16" fill="#FFFFFF" letter-spacing="0.5">
      <textPath href="#textCurve" startOffset="50%" text-anchor="middle">D'GULA <tspan fill="#F4C542" font-size="14">&#9670;</tspan> PIZZARIA</textPath>
    </text>
  </g>
</svg>
